name: Daily aespa database check

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run daily updater
        run: python scripts/update_site.py --apply

      - name: Commit changes
        run: |
          git config user.name "aespa database updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/automation_candidates.json
          git diff --cached --quiet || git commit -m "Daily aespa database update"
          git push


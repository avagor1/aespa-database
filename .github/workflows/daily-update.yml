name: Daily aespa database update

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Paris"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Run update script
        run: python scripts/update_site.py

      - name: Save updates
        run: |
          git config user.name "aespa database updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Daily database update"
          git push
